<!doctype html>
<html><head><meta charset="utf-8"><title>BlindAge</title>
<style>
body{font-family:system-ui;width:22rem;margin:0;padding:.8rem;font-size:14px}
h1{font-size:1.1rem;margin:.2rem 0 .6rem}
.card{border:1px solid #cbd5e0;border-radius:.4rem;padding:.6rem;margin:.5rem 0}
.consent{background:#fffaf0;border-color:#dd6b20}
.recv{color:#22543d}.norecv{color:#742a2a}
button{padding:.5rem .8rem;border:0;border-radius:.3rem;background:#2b6cb0;color:#fff;cursor:pointer}
ul{margin:.3rem 0;padding-left:1.1rem}textarea{width:100%;height:4rem}
small{color:#4a5568}
</style></head><body>
<h1>BlindAge</h1>
<div id="pending"></div>
<div class="card"><strong>Tokens</strong><div id="inventory"><small>none</small></div></div>
<div class="card"><strong>Import tokens</strong>
<p><small>Run <code>blindage export --out tokens.json</code>, then choose the file
(recommended) or paste its contents.</small></p>
<p><input type="file" id="importFile" accept=".json,application/json"></p>
<textarea id="importText" placeholder='{"version":"1.0","tokens":[...]}'></textarea>
<button id="importBtn">Import pasted text</button><div id="importMsg"></div></div>
<script src="popup.js" type="module"></script>
</body></html>
